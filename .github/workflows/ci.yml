name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 类型检查 · 代码检查 · 测试 · 构建
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码检查
        run: npm run lint

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build
